name: Sable Android Port

on:
  workflow_dispatch:

jobs:
  build-android-sable:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v4

      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: verify android ndk
        run: |
          echo "NDK: ${ANDROID_SDK_ROOT}/ndk-bundle"
          ls ${ANDROID_SDK_ROOT}/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang || echo "not found"

      - name: setup rust for aarch64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: configure cargo to use android ndk (ai help)
        run: |
          mkdir -p common/src/main/rust/rapier/.cargo
          cat <<EOF > common/src/main/rust/rapier/.cargo/config.toml
          [target.aarch64-linux-android]
          linker = "${ANDROID_SDK_ROOT}/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - name: build sable/rapier
        working-directory: common/src/main/rust/rapier
        run: |
          export RUSTC_BOOTSTRAP=1 # nightly required
          cargo build --release --target aarch64-linux-android

      - name: build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build -x common:buildRustNatives

      - name: inject lib into jar (ai help)
        run: |
          JAR_FILE=$(find neoforge/build/libs/ -name "sable-neoforge-*.jar" | grep -v "sources" | head -n 1)
          SO_FILE="common/src/main/rust/rapier/target/aarch64-linux-android/release/libsable_rapier.so"
          
          echo "jar file: $JAR_FILE"
          
          mkdir -p natives/sable_rapier
          cp $SO_FILE natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          zip -u $JAR_FILE natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          mkdir -p out
          cp $JAR_FILE out/sable-android.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sable-Android-Build
          path: out/sable-android.jar
