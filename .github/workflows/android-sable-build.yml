name: Sable Android Port

on:
  workflow_dispatch:

jobs:
  build-android-sable:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v4

      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: setup rust for aarch64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-29
          targets: aarch64-linux-android
          components: rust-src

      - name: install rust-src
        run: rustup component add rust-src

      - name: configure cargo to use android ndk (ai help)
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk-bundle"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -type d | sort -r | head -n 1)
          fi
          
          mkdir -p common/src/main/rust/rapier/.cargo
          cat <<EOF > common/src/main/rust/rapier/.cargo/config.toml
          [target.aarch64-linux-android]
          linker = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF
 
      - name: build sable/rapier
        working-directory: common/src/main/rust/rapier
        run: |
          export RUSTC_BOOTSTRAP=1 # nightly required
          cargo build --release --target aarch64-linux-android
          
      - name: build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew build -x common:buildRustNatives

      - name: inject lib into jar (ai help)
        run: |
          SO_FILE=$(find . -name "libsable_rapier.so" | grep "release" | grep "aarch64-linux-android" | head -n 1)
          echo "native: $SO_FILE"
          
          JAR_FILE=$(find neoforge/build/libs/ -name "sable-neoforge-*.jar" | grep -v "sources" | head -n 1)
          echo "jar file: $JAR_FILE"
          
          mkdir -p natives/sable_rapier
          cp $SO_FILE natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          zip -u "$JAR_FILE" natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          mkdir -p out
          cp $JAR_FILE out/sable-android.jar

      - name: upload it (please)
        uses: actions/upload-artifact@v4
        with:
          name: Sable-Android-Build
          path: out/sable-android.jar
