name: Sable Native Android Port

on:
  workflow_dispatch:
    inputs:
      loader:
        description: 'Target Modloader'
        required: true
        default: 'neoforge'
        type: choice
        options:
          - neoforge
          - fabric
      build_ref:
        description: 'Tag or Branch to build'
        required: true
        default: 'main'
        
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_ref }}-${{ github.event.inputs.loader }}
  cancel-in-progress: true

jobs:
  build-sable:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref }}
          fetch-depth: 0

      - name: source patching
        run: |
          RAPIER_FILE=$(find . -name "Rapier3D.java")
          if [ -f "$RAPIER_FILE" ]; then
            sed -i 's|private static final String NATIVE_DIR = ".sable/natives";|private static final String NATIVE_DIR = System.getProperty("java.io.tmpdir") + "/.sable/natives";|g' "$RAPIER_FILE"
            echo "patched $RAPIER_FILE"
          else
            echo "Rapier3D.java not found"
          fi

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: setup rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-29
          targets: aarch64-linux-android

      - name: setup Android NDK
        uses: nndixon/setup-android-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: build rust natives (rapier)
        run: |
          cd common/src/main/resources
          cargo build --release --target aarch64-linux-android

      - name: mod building
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ github.event.inputs.loader }}:build -x test

      - name: build imgui (Android)
        run: |
          mkdir -p imgui-build
          JNI_INCLUDE="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          
          arm64-v8a-linux-android34-clang++ -shared -fPIC \
            -I$JNI_INCLUDE -I$JNI_INCLUDE/aarch64-linux-android \
            $(find . -name "*.cpp" | grep "imgui") \
            -o imgui-build/libimgui-java64.so -landroid -llog

      - name: injections
        run: |
          SABLE_JAR=$(find ${{ github.event.inputs.loader }}/build/libs/ -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          VER=$(echo ${{ github.event.inputs.build_ref }} | sed 's/refs\/tags\///')
          FINAL_NAME="sable-android-${{ github.event.inputs.loader }}-${VER}.jar"
          cp "$SABLE_JAR" "$FINAL_NAME"
          
          VEIL_INTERNAL_PATH=$(unzip -l "$FINAL_NAME" | grep -o "META-INF/jarjar/veil-.*\.jar" | head -n 1)
          unzip "$FINAL_NAME" "$VEIL_INTERNAL_PATH" -d .
          
          mkdir -p io/imgui/java/native-bin
          cp imgui-build/libimgui-java64.so io/imgui/java/native-bin/
          zip -u "$VEIL_INTERNAL_PATH" io/imgui/java/native-bin/libimgui-java64.so
          
          RAPIER_SO=$(find target/aarch64-linux-android/release/ -name "libsable_rapier.so" | head -n 1)
          mkdir -p natives/sable_rapier
          cp "$RAPIER_SO" natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          zip -u "$FINAL_NAME" "$VEIL_INTERNAL_PATH"
          zip -u "$FINAL_NAME" natives/sable_rapier/sable_rapier_aarch64_linux.so

          echo "ASSET_PATH=$FINAL_NAME" >> $GITHUB_ENV

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          tag_name: ${{ github.event.inputs.build_ref }}
          name: "Sable Android Port - ${{ github.event.inputs.build_ref }}"
          body: "Sable Android for ${{ github.event.inputs.loader }} loader\nAutomated Build V3.0-PRE-TESTING (Active build tests not full release)\n\n[View Original Release](https://github.com/ryanhcode/sable/releases/tag/${{ github.event.inputs.build_ref }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
