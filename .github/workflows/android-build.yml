name: Sable Native Android Port

on:
  workflow_dispatch:
    inputs:
      loader:
        required: true
        default: 'neoforge'
        type: choice
        options:
          - neoforge
          - fabric
      build_ref:
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_ref }}-${{ github.event.inputs.loader }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-sable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref }}
          fetch-depth: 0

      - name: setting version variables
        run: |
          echo "LOADER=${{ github.event.inputs.loader }}" >> $GITHUB_ENV
          echo "VERSION_NAME=${{ github.event.inputs.build_ref }}" >> $GITHUB_ENV

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: setup rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-29
          targets: aarch64-linux-android
          components: rust-src

      - name: setup paths and environment
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/25.2.9519653"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$CLANG" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV

      - name: build imgui-java natives
        run: |
          git clone --depth 1 https://github.com/SpaiR/imgui-java.git
          cd imgui-java
          chmod +x ./gradlew
          
          ./gradlew :imgui-binding:generateLibs -Denvs=android -Dlocal -Dtarget=all -PandroidNdkPath=$ANDROID_NDK_HOME -PandroidAbi=arm64-v8a
          
          JNI_SRC_DIR=$(find $(pwd) -name "jni_common.cpp" -print -quit | xargs dirname)
          
          if [ -z "$JNI_SRC_DIR" ]; then
            echo "JNI not found"
            exit 1
          fi
          
          echo "found JNI at: $JNI_SRC_DIR"
          cd "$JNI_SRC_DIR"
          
          IMGUI_ROOT_PATH=$(pwd | sed 's|/imgui-binding.*||')
          echo "IMGUI_ROOT_PATH is: $IMGUI_ROOT_PATH"
          
          echo "--- PATHS ---"
          ls -la "$IMGUI_ROOT_PATH/include/imgui" || echo "IMGUI DIR MISSING"
          ls -la "${JAVA_HOME}/include" || echo "JAVA INCLUDE MISSING"
          
          cat <<EOF > Application.mk
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-24
          APP_STL := c++_static
          APP_CPPFLAGS := -frtti -fexceptions
          EOF

          cat <<EOF > Android.mk
          LOCAL_PATH := \$(call my-dir)
          include \$(CLEAR_VARS)

          LOCAL_MODULE := imgui-java64
          
          LOCAL_C_INCLUDES := \$(LOCAL_PATH)
          LOCAL_C_INCLUDES += ${JAVA_HOME}/include
          LOCAL_C_INCLUDES += ${JAVA_HOME}/include/linux
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/imgui
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/implot
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/imnodes
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/ImGuiColorTextEdit
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/ImGuiFileDialog
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/imgui-knobs
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/imgui-node-editor
          LOCAL_C_INCLUDES += ${IMGUI_ROOT_PATH}/include/imguizmo
          
          LOCAL_SRC_FILES := \$(wildcard \$(LOCAL_PATH)/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/imgui/*.cpp) \$(wildcard ${IMGUI_ROOT_PATH}/include/imgui/*.c)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/implot/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/imnodes/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/ImGuiColorTextEdit/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/ImGuiFileDialog/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/imgui-knobs/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/imgui-node-editor/*.cpp)
          LOCAL_SRC_FILES += \$(wildcard ${IMGUI_ROOT_PATH}/include/imguizmo/*.cpp)

          LOCAL_LDLIBS := -llog -landroid
          include \$(BUILD_SHARED_LIBRARY)
          EOF
          
          echo "--- ANDROID.MK ---"
          cat Android.mk
          
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk || {
            echo "--- NDK BUILD FAILED ---"
            tree "$IMGUI_ROOT_PATH/include"
            exit 1
          }
          
          ROOT_DIR="/home/runner/work/sable_android/sable_android"
          mkdir -p "$ROOT_DIR/imgui-native-android"
          
          if [ -f "libs/arm64-v8a/libimgui-java64.so" ]; then
            cp libs/arm64-v8a/libimgui-java64.so "$ROOT_DIR/imgui-native-android/"
            echo "SUCCESFUL, found imgui binary"
          else
            echo "imgui binary not found"
            find . -name "*.so"
            exit 1
          fi
          
      - name: build rapier (rust natives)
        run: |
          cargo build --release --target aarch64-linux-android
          
          mkdir -p $GITHUB_WORKSPACE/rapier-native-android
          
          RAPIER_SO=$(find target/aarch64-linux-android/release -name "*.so" | head -n 1)
          cp "$RAPIER_SO" $GITHUB_WORKSPACE/rapier-native-android/sable_rapier_aarch64_linux.so
          echo "SUCCESS, rapier ok"

      - name: build mod
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ env.LOADER }}:assemble -x common:buildRustNatives

      - name: perform jar-jar
        run: |
          mkdir -p final
          SABLE_JAR=$(find ${{ env.LOADER }}/build/libs -name "sable-*.jar" ! -name "*-sources.jar" | head -n 1)
          FINAL_NAME="sable-ANDROID-${{ github.event.inputs.build_ref }}.jar"
          cp "$SABLE_JAR" "final/$FINAL_NAME"
          
          mkdir -p final/natives/sable_rapier
          cp "$GITHUB_WORKSPACE/rapier-native-android/sable_rapier_aarch64_linux.so" final/natives/sable_rapier/
          
          cd final
          zip -u "$FINAL_NAME" natives/sable_rapier/sable_rapier_aarch64_linux.so
          
          VEIL_INTERNAL_PATH=$(unzip -l "$FINAL_NAME" | grep "veil-.*\.jar" | awk '{print $4}' | head -n 1 | tr -d '\r')
          unzip "$FINAL_NAME" "$VEIL_INTERNAL_PATH" -d .
          
          mkdir -p veil_patch
          unzip "$VEIL_INTERNAL_PATH" -d veil_patch/
          
          TARGET_DIR_1="veil_patch/io/imgui/java/native-bin/linux-aarch64"
          TARGET_DIR_2="veil_patch/natives/linux-aarch64"
          
          mkdir -p "$TARGET_DIR_1"
          mkdir -p "$TARGET_DIR_2"
          
          cp "$GITHUB_WORKSPACE/imgui-native-android/libimgui-java64.so" "$TARGET_DIR_1/libimgui-java64.so"
          cp "$GITHUB_WORKSPACE/imgui-native-android/libimgui-java64.so" "$TARGET_DIR_2/libimgui-java64.so"
          
          cd veil_patch
          zip -r ../patched_veil.jar .
          cd ..
          
          mv patched_veil.jar "$VEIL_INTERNAL_PATH"
          zip -d "$FINAL_NAME" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" || true
          zip -u "$FINAL_NAME" "$VEIL_INTERNAL_PATH"
          
          echo "ASSET_PATH=final/$FINAL_NAME" >> $GITHUB_ENV

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.ASSET_PATH }}"
          tag_name: "${{ github.event.inputs.build_ref }}"
          name: "Sable Android ${{ github.event.inputs.build_ref }}"
          body: "Sable Android for ${{ github.event.inputs.loader }} loader\nAutomated Build\n\n[View Original Release](https://github.com/ryanhcode/sable/releases/tag/${{ github.event.inputs.build_ref }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
