name: Sable Native Android Port

on:
  workflow_dispatch:
    inputs:
      loader:
        description: 'Target Modloader'
        required: true
        default: 'neoforge'
        type: choice
        options:
          - neoforge
          - fabric
      build_ref:
        description: 'Tag or Branch to build'
        required: true
        default: 'main'
        
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.build_ref }}-${{ github.event.inputs.loader }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-sable:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref }}
          fetch-depth: 0

      - name: set loader environment
        run: |
          echo "LOADER=${{ github.event.inputs.loader }}" >> $GITHUB_ENV
          echo "VERSION_NAME=${{ github.event.inputs.build_ref }}" >> $GITHUB_ENV

      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: setup rust for aarch64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-29
          targets: aarch64-linux-android
          components: rust-src

      - name: install rust-src
        run: rustup component add rust-src

      - name: install android ndk
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: build imgui
        run: |
          sudo apt-get update && sudo apt-get install -y ant
          git clone --depth 1 https://github.com/SpaiR/imgui-java.git
          cd imgui-java
          chmod +x ./gradlew
          
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_HOME=$ANDROID_NDK_HOME
          
          ./gradlew :imgui-binding:generateLibs -Denvs=android -Dlocal -Dtarget=all \
            -PandroidNdkPath=$ANDROID_NDK_HOME -PandroidAbi=arm64-v8a
          
          cd imgui-binding/build/jni
          ant -Denvs=android -Dndk.path=$ANDROID_NDK_HOME -Dabi=arm64-v8a compile-natives
          
          cd $GITHUB_WORKSPACE
          mkdir -p imgui-native-android
          LIB_PATH=$(find $GITHUB_WORKSPACE/imgui-java -name "libimgui-java64.so" | grep "android" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            LIB_PATH=$(find $GITHUB_WORKSPACE/imgui-java -name "libimgui-java64.so" | head -n 1)
          fi
          cp "$LIB_PATH" imgui-native-android/libimgui-java64.so

      
      - name: build rapier physics
        run: |
          RUST_DIR=$(dirname $(find . -name "Cargo.toml" | grep -v "imgui" | head -n 1))
          cd $RUST_DIR
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          cargo build --target aarch64-linux-android --release
          
          mkdir -p $GITHUB_WORKSPACE/rapier-native-android
          find $GITHUB_WORKSPACE -path "*/aarch64-linux-android/release/*.so" -not -path "*/imgui-java/*" -exec cp {} $GITHUB_WORKSPACE/rapier-native-android/sable_rapier_aarch64_linux.so \;
          
      - name: build the mod
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ env.LOADER }}:assemble -x common:buildRustNatives

      - name: perform jar-jar
        run: |
          mkdir -p final
          SABLE_JAR=$(find ${{ env.LOADER }}/build/libs -name "sable-*.jar" ! -name "*-sources.jar" | head -n 1)
          FINAL_NAME="sable-ANDROID-${{ github.event.inputs.build_ref }}.jar"
          cp "$SABLE_JAR" "final/$FINAL_NAME"
          
          cd final
          zip -u -j "$FINAL_NAME" ../rapier-native-android/sable_rapier_aarch64_linux.so
          
          VEIL_INTERNAL_PATH=$(unzip -l "$FINAL_NAME" | grep "veil-.*\.jar" | awk '{print $4}' | head -n 1 | tr -d '\r')
          unzip "$FINAL_NAME" "$VEIL_INTERNAL_PATH" -d .
          
          mkdir -p veil_patch
          unzip "$VEIL_INTERNAL_PATH" -d veil_patch/
          
          TARGET_DIR="veil_patch/io/imgui/java/native-bin/linux-aarch64"
          mkdir -p "$TARGET_DIR"
          cp ../imgui-native-android/libimgui-java64.so "$TARGET_DIR/libimgui-java64.so"
          
          cd veil_patch
          zip -r ../patched_veil.jar .
          cd ..
          
          mv patched_veil.jar "$VEIL_INTERNAL_PATH"
          zip -d "$FINAL_NAME" "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" || true
          zip -u "$FINAL_NAME" "$VEIL_INTERNAL_PATH"
          
          echo "ASSET_PATH=final/$FINAL_NAME" >> $GITHUB_ENV
          
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.ASSET_PATH }}"
          tag_name: "${{ github.event.inputs.build_ref }}"
          name: "Sable Android ${{ github.event.inputs.build_ref }}"
          body: "Sable Android for ${{ github.event.inputs.loader }} loader\nAutomated Build\n\n[View Original Release](https://github.com/ryanhcode/sable/releases/tag/${{ github.event.inputs.build_ref }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
